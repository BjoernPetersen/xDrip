name: Unit Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ 17 ]

    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.3.0
      with:
        java-version: ${{ matrix.java-version }}
        distribution: temurin
    - uses: gradle/actions/setup-gradle@v6.4.1
    - name: Run unit tests and assemble APKs
      run: ./gradlew assembleProdRelease testProdReleaseUnitTest
    - name: Check Output
      run: bash ./etc/CheckBuild/check-release.sh test
