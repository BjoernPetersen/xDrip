name: Signed Release Build

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write # needed to create GitHub Releases on tag pushes

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.XDRIP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret XDRIP_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "XDRIP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          XDRIP_KEYSTORE_PASSWORD: ${{ secrets.XDRIP_KEYSTORE_PASSWORD }}
          XDRIP_KEY_ALIAS: ${{ secrets.XDRIP_KEY_ALIAS }}
          XDRIP_KEY_PASSWORD: ${{ secrets.XDRIP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleProdRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/prod/release/app-prod-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: xdrip-prod-release
          path: app/build/outputs/apk/prod/release/app-prod-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/prod/release/app-prod-release.apk --title "$GITHUB_REF_NAME" --generate-notes
